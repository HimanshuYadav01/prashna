services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports: ["8000:8000"]
    environment:
      - MOCK_LLM=${MOCK_LLM:-false}
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      - PRASHNA_DB=/data/sqlite/prashna.db
      - CHROMA_DIR=/data/chroma
    volumes:
      - sqlite_data:/data/sqlite
      - chroma_data:/data/chroma
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports: ["8501:8501"]
    environment:
      - API_URL=http://api:8000
    depends_on: [api]

volumes:
  sqlite_data: {}
  chroma_data: {}
